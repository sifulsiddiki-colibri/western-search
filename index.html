<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Western Schools — Course Search (prototype)</title>
    <link rel="stylesheet" href="css/search-widget.css" />
    <style>
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;

        margin: 60px auto 120px;

      .dev-note {

      Prototype — not on the WordPress theme yet. Pick a state, then search

    <div id="ws-course-search"></div>

    <script src="js/search-widget.js"></script>
    <script>
      WSCourseSearch.init("#ws-course-search");
    </script>
